<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Platformer Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            font-family: Arial, sans-serif;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
        }
        
        canvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
        }
        
        .controls {
            margin-top: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .score {
            font-size: 20px;
            font-weight: bold;
        }
        
        .instructions {
            font-size: 14px;
        }
        
        button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            background: #00b894;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background: #00a085;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏃‍♂️ Simple Platformer</h1>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="controls">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="instructions">
                A/D or Arrow Keys: Move | W/Space: Jump
            </div>
            <button onclick="game.restart()">Restart</button>
        </div>
        
        <div id="gameOver" class="game-over">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="game.restart()">Play Again</button>
        </div>
    </div>

    <script>
        class PlatformerGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.init();
                this.setupEventListeners();
                this.gameLoop();
            }
            
            init() {
                // Player properties
                this.player = {
                    x: 100,
                    y: 200,
                    width: 30,
                    height: 40,
                    velocityX: 0,
                    velocityY: 0,
                    speed: 5,
                    jumpPower: 15,
                    onGround: false,
                    color: '#e74c3c'
                };
                
                // Game state
                this.gravity = 0.8;
                this.score = 0;
                this.gameRunning = true;
                
                // Input handling
                this.keys = {
                    left: false,
                    right: false,
                    jump: false
                };
                
                // Platforms
                this.platforms = [
                    { x: 0, y: 360, width: 200, height: 40 },
                    { x: 250, y: 300, width: 150, height: 20 },
                    { x: 450, y: 250, width: 150, height: 20 },
                    { x: 650, y: 200, width: 150, height: 20 },
                    { x: 350, y: 150, width: 100, height: 20 },
                    { x: 550, y: 100, width: 100, height: 20 },
                    { x: 150, y: 50, width: 100, height: 20 }
                ];
                
                // Coins
                this.coins = [
                    { x: 120, y: 320, collected: false },
                    { x: 320, y: 260, collected: false },
                    { x: 520, y: 210, collected: false },
                    { x: 720, y: 160, collected: false },
                    { x: 400, y: 110, collected: false },
                    { x: 600, y: 60, collected: false },
                    { x: 200, y: 10, collected: false }
                ];
                
                // Enemies (simple moving obstacles)
                this.enemies = [
                    { x: 300, y: 280, width: 20, height: 20, direction: 1, speed: 2, platform: 1 },
                    { x: 500, y: 230, width: 20, height: 20, direction: 1, speed: 1.5, platform: 2 },
                    { x: 700, y: 180, width: 20, height: 20, direction: -1, speed: 2, platform: 3 }
                ];
                
                this.updateDisplay();
            }
            
            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    switch(e.key.toLowerCase()) {
                        case 'a':
                        case 'arrowleft':
                            this.keys.left = true;
                            break;
                        case 'd':
                        case 'arrowright':
                            this.keys.right = true;
                            break;
                        case 'w':
                        case ' ':
                        case 'arrowup':
                            this.keys.jump = true;
                            e.preventDefault();
                            break;
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    switch(e.key.toLowerCase()) {
                        case 'a':
                        case 'arrowleft':
                            this.keys.left = false;
                            break;
                        case 'd':
                        case 'arrowright':
                            this.keys.right = false;
                            break;
                        case 'w':
                        case ' ':
                        case 'arrowup':
                            this.keys.jump = false;
                            break;
                    }
                });
            }
            
            update() {
                if (!this.gameRunning) return;
                
                // Handle input
                if (this.keys.left) {
                    this.player.velocityX = -this.player.speed;
                } else if (this.keys.right) {
                    this.player.velocityX = this.player.speed;
                } else {
                    this.player.velocityX = 0;
                }
                
                if (this.keys.jump && this.player.onGround) {
                    this.player.velocityY = -this.player.jumpPower;
                    this.player.onGround = false;
                }
                
                // Apply gravity
                this.player.velocityY += this.gravity;
                
                // Update player position
                this.player.x += this.player.velocityX;
                this.player.y += this.player.velocityY;
                
                // Keep player in bounds horizontally
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x + this.player.width > this.canvas.width) {
                    this.player.x = this.canvas.width - this.player.width;
                }
                
                // Platform collision
                this.player.onGround = false;
                this.platforms.forEach(platform => {
                    if (this.checkCollision(this.player, platform)) {
                        // Landing on top of platform
                        if (this.player.velocityY > 0 && 
                            this.player.y < platform.y) {
                            this.player.y = platform.y - this.player.height;
                            this.player.velocityY = 0;
                            this.player.onGround = true;
                        }
                    }
                });
                
                // Ground collision (bottom of canvas)
                if (this.player.y + this.player.height > this.canvas.height) {
                    this.player.y = this.canvas.height - this.player.height;
                    this.player.velocityY = 0;
                    this.player.onGround = true;
                }
                
                // Coin collection
                this.coins.forEach(coin => {
                    if (!coin.collected && this.checkCoinCollision(this.player, coin)) {
                        coin.collected = true;
                        this.score += 10;
                        this.updateDisplay();
                    }
                });
                
                // Update enemies
                this.enemies.forEach((enemy, index) => {
                    const platform = this.platforms[enemy.platform];
                    enemy.x += enemy.direction * enemy.speed;
                    
                    // Reverse direction at platform edges
                    if (enemy.x <= platform.x || enemy.x + enemy.width >= platform.x + platform.width) {
                        enemy.direction *= -1;
                    }
                    
                    // Check collision with player
                    if (this.checkCollision(this.player, enemy)) {
                        this.gameOver();
                    }
                });
                
                // Check if player fell off the world
                if (this.player.y > this.canvas.height + 100) {
                    this.gameOver();
                }
            }
            
            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }
            
            checkCoinCollision(player, coin) {
                const coinSize = 15;
                return player.x < coin.x + coinSize &&
                       player.x + player.width > coin.x &&
                       player.y < coin.y + coinSize &&
                       player.y + player.height > coin.y;
            }
            
            draw() {
                // Clear canvas with gradient background
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#98FB98');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw platforms
                this.ctx.fillStyle = '#8B4513';
                this.platforms.forEach(platform => {
                    this.ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    
                    // Add some grass on top
                    this.ctx.fillStyle = '#228B22';
                    this.ctx.fillRect(platform.x, platform.y - 5, platform.width, 5);
                    this.ctx.fillStyle = '#8B4513';
                });
                
                // Draw coins
                this.coins.forEach(coin => {
                    if (!coin.collected) {
                        this.ctx.fillStyle = '#FFD700';
                        this.ctx.beginPath();
                        this.ctx.arc(coin.x + 7.5, coin.y + 7.5, 7.5, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        // Add shine effect
                        this.ctx.fillStyle = '#FFFF99';
                        this.ctx.beginPath();
                        this.ctx.arc(coin.x + 5, coin.y + 5, 3, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                });
                
                // Draw enemies
                this.ctx.fillStyle = '#e74c3c';
                this.enemies.forEach(enemy => {
                    this.ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    
                    // Add simple face
                    this.ctx.fillStyle = '#000';
                    this.ctx.fillRect(enemy.x + 5, enemy.y + 5, 2, 2);
                    this.ctx.fillRect(enemy.x + 13, enemy.y + 5, 2, 2);
                    this.ctx.fillRect(enemy.x + 7, enemy.y + 12, 6, 2);
                    this.ctx.fillStyle = '#e74c3c';
                });
                
                // Draw player
                this.ctx.fillStyle = this.player.color;
                this.ctx.fillRect(this.player.x, this.player.y, this.player.width, this.player.height);
                
                // Add simple face to player
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(this.player.x + 8, this.player.y + 8, 3, 3);
                this.ctx.fillRect(this.player.x + 19, this.player.y + 8, 3, 3);
                this.ctx.fillRect(this.player.x + 10, this.player.y + 20, 10, 2);
                
                // Draw movement indicator
                if (!this.player.onGround) {
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    this.ctx.fillRect(this.player.x + 5, this.player.y + this.player.height, 20, 3);
                }
            }
            
            updateDisplay() {
                document.getElementById('score').textContent = this.score;
            }
            
            gameOver() {
                this.gameRunning = false;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'block';
            }
            
            restart() {
                document.getElementById('gameOver').style.display = 'none';
                this.init();
            }
            
            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // Initialize game
        let game;
        
        window.addEventListener('load', () => {
            game = new PlatformerGame();
        });
    </script>
</body>
</html>
