<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Style Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .main-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            font-size: 60px;
            cursor: pointer;
            margin: 20px;
            transition: all 0.2s;
            background: linear-gradient(145deg, #ff6b6b, #ee5a52);
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .main-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        
        .main-button:active {
            transform: scale(0.95);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .upgrades {
            margin-top: 30px;
        }
        
        .upgrade {
            background: #e9ecef;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        
        .upgrade:hover {
            background: #dee2e6;
            transform: translateY(-2px);
        }
        
        .upgrade-info {
            text-align: left;
        }
        
        .upgrade-name {
            font-weight: bold;
            color: #333;
        }
        
        .upgrade-description {
            font-size: 12px;
            color: #666;
        }
        
        .upgrade-button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #28a745;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .upgrade-button:hover {
            background: #218838;
        }
        
        .upgrade-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .achievements {
            margin-top: 30px;
            text-align: left;
        }
        
        .achievement {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            opacity: 0.5;
            transition: all 0.3s;
        }
        
        .achievement.unlocked {
            opacity: 1;
            background: #d4edda;
            border-color: #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🍪 Cookie Empire</h1>
        
        <button id="mainButton" class="main-button">🍪</button>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Cookies</div>
                <div id="cookies" class="stat-value">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Per Second</div>
                <div id="cps" class="stat-value">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Clicked</div>
                <div id="totalClicks" class="stat-value">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Click Power</div>
                <div id="clickPower" class="stat-value">1</div>
            </div>
        </div>
        
        <div class="upgrades">
            <h3>Upgrades</h3>
            <div id="upgradesList"></div>
        </div>
        
        <div class="achievements">
            <h3>Achievements</h3>
            <div id="achievementsList"></div>
        </div>
    </div>

    <script>
        class CookieGame {
            constructor() {
                this.cookies = 0;
                this.totalClicks = 0;
                this.clickPower = 1;
                this.cookiesPerSecond = 0;
                
                this.upgrades = [
                    {
                        id: 'cursor',
                        name: 'Auto Cursor',
                        description: 'Automatically clicks for you',
                        baseCost: 15,
                        cost: 15,
                        owned: 0,
                        cps: 0.1
                    },
                    {
                        id: 'grandma',
                        name: 'Grandma',
                        description: 'A nice grandma to bake cookies',
                        baseCost: 100,
                        cost: 100,
                        owned: 0,
                        cps: 1
                    },
                    {
                        id: 'farm',
                        name: 'Cookie Farm',
                        description: 'Grows cookie trees',
                        baseCost: 1100,
                        cost: 1100,
                        owned: 0,
                        cps: 8
                    },
                    {
                        id: 'mine',
                        name: 'Cookie Mine',
                        description: 'Mines chocolate chips',
                        baseCost: 12000,
                        cost: 12000,
                        owned: 0,
                        cps: 47
                    },
                    {
                        id: 'factory',
                        name: 'Cookie Factory',
                        description: 'Mass produces cookies',
                        baseCost: 130000,
                        cost: 130000,
                        owned: 0,
                        cps: 260
                    }
                ];
                
                this.achievements = [
                    { id: 'first_click', name: 'First Click', description: 'Click your first cookie', unlocked: false, requirement: () => this.totalClicks >= 1 },
                    { id: 'hundred_clicks', name: 'Clicker', description: 'Click 100 times', unlocked: false, requirement: () => this.totalClicks >= 100 },
                    { id: 'thousand_cookies', name: 'Cookie Monster', description: 'Have 1,000 cookies', unlocked: false, requirement: () => this.cookies >= 1000 },
                    { id: 'first_upgrade', name: 'Upgrader', description: 'Buy your first upgrade', unlocked: false, requirement: () => this.upgrades.some(u => u.owned > 0) },
                    { id: 'ten_cps', name: 'Automation', description: 'Reach 10 cookies per second', unlocked: false, requirement: () => this.cookiesPerSecond >= 10 }
                ];
                
                this.setupEventListeners();
                this.renderUpgrades();
                this.renderAchievements();
                this.startGameLoop();
                this.updateDisplay();
            }
            
            setupEventListeners() {
                document.getElementById('mainButton').addEventListener('click', () => {
                    this.clickCookie();
                });
            }
            
            clickCookie() {
                this.cookies += this.clickPower;
                this.totalClicks++;
                this.updateDisplay();
                this.checkAchievements();
                this.animateButton();
            }
            
            animateButton() {
                const button = document.getElementById('mainButton');
                button.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    button.style.transform = 'scale(1)';
                }, 100);
            }
            
            buyUpgrade(upgradeId) {
                const upgrade = this.upgrades.find(u => u.id === upgradeId);
                if (!upgrade || this.cookies < upgrade.cost) return;
                
                this.cookies -= upgrade.cost;
                upgrade.owned++;
                
                // Increase cost by 15% each time
                upgrade.cost = Math.ceil(upgrade.baseCost * Math.pow(1.15, upgrade.owned));
                
                this.calculateCPS();
                this.updateDisplay();
                this.renderUpgrades();
                this.checkAchievements();
            }
            
            calculateCPS() {
                this.cookiesPerSecond = this.upgrades.reduce((total, upgrade) => {
                    return total + (upgrade.cps * upgrade.owned);
                }, 0);
            }
            
            updateDisplay() {
                document.getElementById('cookies').textContent = Math.floor(this.cookies).toLocaleString();
                document.getElementById('cps').textContent = this.cookiesPerSecond.toFixed(1);
                document.getElementById('totalClicks').textContent = this.totalClicks.toLocaleString();
                document.getElementById('clickPower').textContent = this.clickPower;
            }
            
            renderUpgrades() {
                const container = document.getElementById('upgradesList');
                container.innerHTML = '';
                
                this.upgrades.forEach(upgrade => {
                    const upgradeDiv = document.createElement('div');
                    upgradeDiv.className = 'upgrade';
                    
                    const canAfford = this.cookies >= upgrade.cost;
                    
                    upgradeDiv.innerHTML = `
                        <div class="upgrade-info">
                            <div class="upgrade-name">${upgrade.name} (${upgrade.owned})</div>
                            <div class="upgrade-description">${upgrade.description}</div>
                            <div class="upgrade-description">+${upgrade.cps} CPS</div>
                        </div>
                        <button class="upgrade-button" ${!canAfford ? 'disabled' : ''} onclick="game.buyUpgrade('${upgrade.id}')">
                            ${upgrade.cost.toLocaleString()} cookies
                        </button>
                    `;
                    
                    container.appendChild(upgradeDiv);
                });
            }
            
            renderAchievements() {
                const container = document.getElementById('achievementsList');
                container.innerHTML = '';
                
                this.achievements.forEach(achievement => {
                    const achievementDiv = document.createElement('div');
                    achievementDiv.className = `achievement ${achievement.unlocked ? 'unlocked' : ''}`;
                    achievementDiv.innerHTML = `
                        <strong>${achievement.name}</strong>: ${achievement.description}
                        ${achievement.unlocked ? ' ✓' : ''}
                    `;
                    container.appendChild(achievementDiv);
                });
            }
            
            checkAchievements() {
                let newUnlocks = false;
                this.achievements.forEach(achievement => {
                    if (!achievement.unlocked && achievement.requirement()) {
                        achievement.unlocked = true;
                        newUnlocks = true;
                        this.showAchievementNotification(achievement);
                    }
                });
                
                if (newUnlocks) {
                    this.renderAchievements();
                }
            }
            
            showAchievementNotification(achievement) {
                // Simple notification - could be enhanced with better animations
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #28a745;
                    color: white;
                    padding: 15px;
                    border-radius: 8px;
                    z-index: 1000;
                    animation: slideIn 0.5s ease-out;
                `;
                notification.innerHTML = `🏆 Achievement Unlocked: ${achievement.name}`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
            
            startGameLoop() {
                setInterval(() => {
                    if (this.cookiesPerSecond > 0) {
                        this.cookies += this.cookiesPerSecond / 10; // Update 10 times per second
                        this.updateDisplay();
                    }
                }, 100);
                
                // Less frequent updates for upgrades and achievements
                setInterval(() => {
                    this.renderUpgrades();
                    this.checkAchievements();
                }, 1000);
            }
        }
        
        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
        
        // Start the game
        let game;
        window.addEventListener('load', () => {
            game = new CookieGame();
        });
    </script>
</body>
</html>
